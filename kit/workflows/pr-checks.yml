# Copy of company-resources/kit/workflows/pr-checks.yml. Runs on every pull
# request. Job name "validate" is what the review gate looks for before deploying.
name: Pull Request Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PORTAL_REPO: ${{ github.event.repository.name }}
  KIT: _kit/kit

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Pin every action to a full commit SHA before production use (audit F-20).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0              # gitleaks + "Recently updated" need history

      # Use the kit from a company-resources branch with the SAME name as this
      # PR's branch if one exists (kit + content changed together), else main.
      - name: Choose the portal kit version
        id: kit
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/vishnuatnerdience/company-resources.git "$BRANCH" >/dev/null 2>&1; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Get the shared portal kit (theme + build scripts)
        uses: actions/checkout@v7
        with:
          repository: vishnuatnerdience/company-resources
          ref: ${{ steps.kit.outputs.ref }}
          path: _kit
          # token: ${{ secrets.KIT_READ_TOKEN }}   # needed once company-resources is private

      - name: Check the kit is present
        run: |
          echo "Using portal kit from company-resources@${{ steps.kit.outputs.ref }}"
          test -f "$KIT/requirements.txt" || {
            echo "::error::company-resources@${{ steps.kit.outputs.ref }} has no kit/. Merge the kit into company-resources main, or push a company-resources branch named '${{ github.head_ref }}'."
            exit 1
          }

      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }

      - run: pip install -r $KIT/requirements.txt

      - name: Validate metadata (every page checked against its site's rules)
        run: python $KIT/scripts/validate.py

      - name: Check CODEOWNERS roles
        run: python $KIT/scripts/review_gate.py --lint

      - name: Lint Markdown style
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "docs/**/*.md"

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build every site of this repo (menus, sections, related docs generated)
        run: python $KIT/scripts/build_all.py

      - name: Check links inside each built site
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}/build" 'build/*/site/**/*.html'
          fail: true

      - name: Show what would change in Cloudflare (dry run, no credentials)
        run: python $KIT/scripts/sync_access.py
